[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.5"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "exchange-calendars>=4.11",
    "langchain-core>=0.3.81",
    "pydantic>=2.0,<2.11",  # pydantic 2.11+ incompatible with langchain-core's AIMessage discriminated union
    "langchain-anthropic>=1.4.6",  # security floor: GHSA path traversal fixed in 1.4.6
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=83.0.0",  # security floor: MANIFEST.in exclusion bypass fixed in 83.0.0
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
    "akshare>=1.15.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Model .* is not in the known model list:RuntimeWarning",
]

[dependency-groups]
dev = [
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "coverage>=7.14.1",
]

[tool.coverage.run]
source = ["tradingagents"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
# Abstract-method ``pass`` bodies are individually # pragma: no cover'd
# in source rather than excluded globally (would over-skip real try/except pass).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".env.example"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "F403", "F405", "N802", "N805", "N806", "UP047"]

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true

[tool.mypy]
# Pin to the CI interpreter so local (possibly newer) Pythons and CI agree.
python_version = "3.12"
ignore_missing_imports = true
files = ["tradingagents/", "cli/"]
