name: Daily Analysis

on:
  schedule:
    # 3:00 AM Beijing time (UTC+8) = 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Override tickers (comma-separated, optional)'
        required: false
        default: ''

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Install gws CLI
        run: npm install -g @anthropic-ai/gws-cli 2>/dev/null || npm install -g gws-cli 2>/dev/null || echo "gws install skipped"

      - name: Setup gws credentials
        run: |
          mkdir -p ~/.config/gws
          echo '${{ secrets.GWS_CREDENTIALS }}' > ~/.config/gws/client_secret.json
          # gws uses keyring but we can set env to use file-based auth
          export GWS_CONFIG_DIR=~/.config/gws

      - name: Sync holdings from Google Sheet
        run: |
          # Sync holdings to local cache before analysis
          uv run python -c "
          import json, os
          from tradingagents.portfolio import PortfolioRepository, PortfolioSyncService
          
          sheet_id = os.environ.get('PORTFOLIO_SHEET_ID', '${{ secrets.PORTFOLIO_SHEET_ID }}')
          if not sheet_id:
              print('No PORTFOLIO_SHEET_ID configured, skipping holdings sync')
              exit(0)
          
          try:
              sync_service = PortfolioSyncService(sheet_id=sheet_id, worksheet='total')
              portfolio = sync_service.sync()
              repo = PortfolioRepository()
              repo.save(portfolio)
              print(f'Synced {len(portfolio.holdings)} holdings to local cache')
          except Exception as e:
              print(f'Holdings sync failed: {e}')
              print('Analysis will run without holdings context')
          "

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          SENSENOVA_API_KEY=${{ secrets.SENSENOVA_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          PORTFOLIO_SHEET_ID=${{ secrets.PORTFOLIO_SHEET_ID }}
          EOF

      - name: Run daily analysis
        run: |
          # If tickers override provided, create temp config
          if [ -n "${{ inputs.tickers }}" ]; then
            TICKERS=$(echo '${{ inputs.tickers }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
            jq --argjson tickers "$TICKERS" '.tickers = $tickers' config/daily.json > /tmp/daily_override.json
            uv run python -m cli.main analyze --config /tmp/daily_override.json
          else
            uv run python -m cli.main analyze --config config/daily.json
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Create GitHub Release with reports
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          TAG="daily-report-$DATE"
          LATEST=$(ls -td reports/*/ 2>/dev/null | head -1)
          
          if [ -z "$LATEST" ]; then
            echo "No reports found, skipping release"
            exit 0
          fi
          
          # Create a zip of all reports
          REPORT ZIP="reports-$DATE.zip"
          cd "$LATEST"
          zip -r "../$REPORT ZIP" . -x "*.pyc" "__pycache__/*"
          cd ..
          
          # Create or update release
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "每日分析报告 $DATE" \
            --notes "TradingAgents 自动分析报告 - $DATE" \
            "$REPORT ZIP"
          
          # Save release URL for Feishu notification
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "RELEASE_URL=$RELEASE_URL" >> /tmp/env_vars
          echo "Release URL: $RELEASE_URL"

      - name: Generate summary and extract decisions
        if: success()
        run: |
          # Find the latest report directory
          LATEST=$(ls -td reports/*/ 2>/dev/null | head -1)
          
          if [ -n "$LATEST" ]; then
            # Generate GitHub Step Summary
            if [ -f "$LATEST/batch_summary.md" ]; then
              echo "## Daily Analysis Summary" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "$LATEST/batch_summary.md" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Extract each ticker's final decision into a summary file
            echo "# 每日分析结论 - $(TZ='Asia/Shanghai' date +%Y-%m-%d)" > /tmp/feishu_summary.md
            echo "" >> /tmp/feishu_summary.md
            
            for ticker_dir in "$LATEST"/*/; do
              ticker_name=$(basename "$ticker_dir")
              decision_file="$ticker_dir/reports/final_trade_decision.md"
              
              if [ -f "$decision_file" ]; then
                # Extract key fields
                RATING=$(grep -m1 "Rating" "$decision_file" | sed 's/.*\*\*Rating\*\*: *//' | tr -d '*')
                ENTRY=$(grep -m1 "Entry" "$decision_file" | grep -v "Entry Price" | sed 's/.*\*\*Entry\*\*: *//' | tr -d '*')
                STOP=$(grep -m1 "Stop" "$decision_file" | grep -v "Stop Loss" | sed 's/.*\*\*Stop\*\*: *//' | tr -d '*')
                TARGET=$(grep -m1 "Price Target" "$decision_file" | sed 's/.*\*\*Price Target\*\*: *//' | tr -d '*')
                SIZE=$(grep -m1 "Size" "$decision_file" | sed 's/.*\*\*Size\*\*: *//' | tr -d '*')
                SUMMARY_LINE=$(grep -m1 "Executive Summary" "$decision_file" | sed 's/.*\*\*Executive Summary\*\*: *//' | tr -d '*')
                
                # Add to summary
                echo "**$ticker_name**" >> /tmp/feishu_summary.md
                echo "- 评级: ${RATING:-—}" >> /tmp/feishu_summary.md
                echo "- 入场: ${ENTRY:-—}" >> /tmp/feishu_summary.md
                echo "- 止损: ${STOP:-—}" >> /tmp/feishu_summary.md
                echo "- 目标: ${TARGET:-—}" >> /tmp/feishu_summary.md
                echo "- 仓位: ${SIZE:-—}" >> /tmp/feishu_summary.md
                if [ -n "$SUMMARY_LINE" ]; then
                  echo "- 理由: ${SUMMARY_LINE:0:100}..." >> /tmp/feishu_summary.md
                fi
                echo "" >> /tmp/feishu_summary.md
              fi
            done
            
            echo "Summary saved to /tmp/feishu_summary.md"
          else
            echo "## Daily Analysis Complete" >> $GITHUB_STEP_SUMMARY
            echo "Reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Feishu
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          RELEASE_TAG="daily-report-$DATE"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          CHAT_ID="oc_6a477c033c31899f3212fa0dd5f10dde"
          
          if [ "$STATUS" = "success" ]; then
            COLOR="green"
            TITLE="✅ 每日分析完成 - $DATE"
          else
            COLOR="red"
            TITLE="❌ 每日分析失败 - $DATE"
          fi

          # Read summary
          SUMMARY=""
          if [ -f /tmp/feishu_summary.md ]; then
            SUMMARY=$(head -c 25000 /tmp/feishu_summary.md)
          elif [ -f /tmp/batch_summary.md ]; then
            SUMMARY=$(head -c 25000 /tmp/batch_summary.md)
          fi

          # Escape JSON special characters in summary
          SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs . | sed 's/^"//;s/"$//')

          # Step 1: Send summary card via webhook
          cat > /tmp/feishu_payload.json <<ENDJSON
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "$TITLE"
                },
                "template": "$COLOR"
              },
              "elements": [
                {
                  "tag": "markdown",
                  "content": "**状态**: $STATUS | **运行**: [查看详情]($RUN_URL)"
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "markdown",
                  "content": "$SUMMARY_ESCAPED"
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "📥 下载完整报告"
                      },
                      "url": "$RELEASE_URL",
                      "type": "primary"
                    },
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "📊 查看 Actions"
                      },
                      "url": "$RUN_URL",
                      "type": "default"
                    }
                  ]
                }
              ]
            }
          }
          ENDJSON

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/feishu_payload.json \
            "${{ secrets.FEISHU_WEBHOOK_URL }}" || echo "Failed to send Feishu card"

          # Step 2: Upload and send complete report as file attachment via Open API
          if [ "$STATUS" = "success" ]; then
            LATEST=$(ls -td reports/*/ 2>/dev/null | head -1)
            REPORT_FILE="$LATEST/complete_report.md"
            
            if [ -f "$REPORT_FILE" ]; then
              # Get tenant_access_token
              TOKEN=$(curl -s -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
                -H "Content-Type: application/json" \
                -d "{\"app_id\":\"${{ secrets.FEISHU_APP_ID }}\",\"app_secret\":\"${{ secrets.FEISHU_APP_SECRET }}\"}" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('tenant_access_token',''))")
              
              if [ -n "$TOKEN" ]; then
                # Upload file
                FILE_KEY=$(curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/files" \
                  -H "Authorization: Bearer $TOKEN" \
                  -F "file_type=stream" \
                  -F "file_name=TradingAgents_${DATE}.md" \
                  -F "file=@$REPORT_FILE" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('data',{}).get('file_key',''))")
                
                # Send file to chat
                if [ -n "$FILE_KEY" ]; then
                  curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"receive_id\": \"$CHAT_ID\",
                      \"msg_type\": \"file\",
                      \"content\": \"{\\\"file_key\\\": \\\"$FILE_KEY\\\"}\"
                    }" > /dev/null
                  echo "Report file sent to Feishu chat"
                fi
              fi
            fi
          fi
