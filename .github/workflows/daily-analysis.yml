name: Daily Analysis

on:
  schedule:
    # 3:00 AM Beijing time (UTC+8) = 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      my_tickers:
        description: 'Override my list tickers (comma-separated, optional)'
        required: false
        default: ''
      erin_tickers:
        description: 'Override Erin list tickers (comma-separated, optional)'
        required: false
        default: ''

permissions:
  contents: write

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  analyze-my:
    name: Analyze My List
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          SENSENOVA_API_KEY=${{ secrets.SENSENOVA_API_KEY }}
          MODELSCOPE_API_KEY=${{ secrets.MODELSCOPE_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Run my list analysis
        run: |
          if [ -n "${{ inputs.my_tickers }}" ]; then
            TICKERS=$(echo '${{ inputs.my_tickers }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
            jq --argjson tickers "$TICKERS" '.tickers = $tickers' config/daily-my.json > /tmp/daily_my_override.json
            uv run python -m cli.main analyze --config /tmp/daily_my_override.json
          else
            uv run python -m cli.main analyze --config config/daily-my.json
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-my-${{ github.run_id }}
          path: reports/
          retention-days: 30

  analyze-erin:
    name: Analyze Erin List
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          SENSENOVA_API_KEY=${{ secrets.SENSENOVA_API_KEY }}
          MODELSCOPE_API_KEY=${{ secrets.MODELSCOPE_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Run Erin list analysis
        run: |
          if [ -n "${{ inputs.erin_tickers }}" ]; then
            TICKERS=$(echo '${{ inputs.erin_tickers }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
            jq --argjson tickers "$TICKERS" '.tickers = $tickers' config/daily-erin.json > /tmp/daily_erin_override.json
            uv run python -m cli.main analyze --config /tmp/daily_erin_override.json
          else
            uv run python -m cli.main analyze --config config/daily-erin.json
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-erin-${{ github.run_id }}
          path: reports/
          retention-days: 30

  notify-feishu:
    name: Notify Feishu
    needs: [analyze-my, analyze-erin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download my reports
        uses: actions/download-artifact@v4
        with:
          name: reports-my-${{ github.run_id }}
          path: reports/my/

      - name: Download Erin reports
        uses: actions/download-artifact@v4
        with:
          name: reports-erin-${{ github.run_id }}
          path: reports/erin/

      - name: Combine reports
        run: |
          mkdir -p reports/combined
          # Merge both report directories into combined/
          for dir in reports/my reports/erin; do
            # Match YYYYMMDD_batch_<suffix>/ (actual cli output dir layout)
            for batch_dir in "$dir"/[0-9]*_batch_*/; do
              [ -d "$batch_dir" ] || continue
              # Copy batch run: flatten into combined/<ticker>/
              for ticker_dir in "$batch_dir"*/; do
                [ -d "$ticker_dir" ] || continue
                ticker=$(basename "$ticker_dir")
                cp -r "$ticker_dir" "reports/combined/$ticker" 2>/dev/null || true
              done
            done
          done
          echo "Combined reports:"
          ls reports/combined/
          # Pick the latest batch dir for summary generation
          LATEST_MY=$(ls -td reports/my/[0-9]*_batch_*/ 2>/dev/null | head -1)
          LATEST_ERIN=$(ls -td reports/erin/[0-9]*_batch_*/ 2>/dev/null | head -1)
          echo "LATEST_MY=$LATEST_MY"
          echo "LATEST_ERIN=$LATEST_ERIN"

      - name: Generate combined summary
        run: |
          uv run python scripts/notify_feishu.py \
            --my-dir reports/my \
            --erin-dir reports/erin \
            --summary-only 2>/dev/null \
            > /tmp/feishu_summary.md
          cat /tmp/feishu_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Create GitHub Release with combined reports
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          TAG="daily-report-$DATE"
          REPORT_ZIP="reports-$DATE.zip"

          # Zip combined reports
          (cd reports/combined && zip -r "$OLDPWD/$REPORT_ZIP" . -x "*.pyc" "__pycache__/*")

          # Create or update release
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "每日分析报告 $DATE" \
            --notes "TradingAgents 自动分析报告 - $DATE（我的 + Erin）" \
            "$REPORT_ZIP"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "Release URL: $RELEASE_URL"

      - name: Notify Feishu
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ needs.analyze-my.result }}/${{ needs.analyze-erin.result }}"
          # Determine overall status
          if echo "$STATUS" | grep -q "failure"; then
            OVERALL="failure"
          elif echo "$STATUS" | grep -q "cancelled"; then
            OVERALL="cancelled"
          else
            OVERALL="success"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          RELEASE_TAG="daily-report-$DATE"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          CHAT_ID="oc_6a477c033c31899f3212fa0dd5f10dde"

          if [ "$OVERALL" = "success" ]; then
            COLOR="green"
            TITLE="✅ 每日分析完成 - $DATE"
          else
            COLOR="red"
            TITLE="❌ 每日分析异常 - $DATE"
          fi

          # Check which lists succeeded
          MY_STATUS="${{ needs.analyze-my.result }}"
          ERIN_STATUS="${{ needs.analyze-erin.result }}"
          STATUS_LINE="**我的 list**: $MY_STATUS | **Erin list**: $ERIN_STATUS"

          # Read summary
          SUMMARY=""
          if [ -f /tmp/feishu_summary.md ]; then
            SUMMARY=$(head -c 25000 /tmp/feishu_summary.md)
          fi

          SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs . | sed 's/^"//;s/"$//')

          cat > /tmp/feishu_payload.json <<ENDJSON
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "$TITLE"
                },
                "template": "$COLOR"
              },
              "elements": [
                {
                  "tag": "markdown",
                  "content": "**运行**: [查看详情]($RUN_URL)\\n$STATUS_LINE"
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "markdown",
                  "content": "$SUMMARY_ESCAPED"
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "📥 下载完整报告"
                      },
                      "url": "$RELEASE_URL",
                      "type": "primary"
                    },
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "📊 查看 Actions"
                      },
                      "url": "$RUN_URL",
                      "type": "default"
                    }
                  ]
                }
              ]
            }
          }
          ENDJSON

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/feishu_payload.json \
            "${{ secrets.FEISHU_WEBHOOK_URL }}" || echo "Failed to send Feishu card"

          # Step 2: Upload and send each ticker's report as file attachment
          if [ "$OVERALL" = "success" ]; then
            TOKEN=$(curl -s -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
              -H "Content-Type: application/json" \
              -d "{\"app_id\":\"${{ secrets.FEISHU_APP_ID }}\",\"app_secret\":\"${{ secrets.FEISHU_APP_SECRET }}\"}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('tenant_access_token',''))")

            if [ -n "$TOKEN" ]; then
              for ticker_dir in reports/combined/*/; do
                [ -d "$ticker_dir" ] || continue
                ticker_name=$(basename "$ticker_dir")
                report_file="$ticker_dir/complete_report.md"

                if [ -f "$report_file" ]; then
                  upload_file="$report_file"
                  upload_name="${ticker_name}_${DATE}.md"
                  file_type="stream"

                  FILE_KEY=$(curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/files" \
                    -H "Authorization: Bearer $TOKEN" \
                    -F "file_type=$file_type" \
                    -F "file_name=$upload_name" \
                    -F "file=@$upload_file" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin).get('data',{}).get('file_key',''))")

                  if [ -n "$FILE_KEY" ]; then
                    curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{
                        \"receive_id\": \"$CHAT_ID\",
                        \"msg_type\": \"file\",
                        \"content\": \"{\\\"file_key\\\": \\\"$FILE_KEY\\\"}\"
                      }" > /dev/null
                    echo "Sent: $upload_name"
                  fi

                  sleep 0.3
                fi
              done
              echo "All ticker reports sent to Feishu chat"
            fi
          fi