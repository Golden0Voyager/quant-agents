name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mypy tradingagents cli --ignore-missing-imports

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ensure all tests have a marker
        run: |
          set +e
          output=$(uv run pytest -m "not unit and not integration and not smoke" --collect-only -q 2>&1)
          status=$?
          set -e
          echo "$output"
          # pytest exits 5 when nothing is collected — the desired state.
          if [ "$status" -ne 5 ]; then
            echo "::error::Every test must be marked unit, integration, or smoke; unmarked tests were collected above."
            exit 1
          fi
      - run: uv run pytest -m unit --no-header -q
      - run: |
          uv run coverage erase
          uv run coverage run --source=tradingagents -m pytest -m unit --no-header -q
          uv run coverage report --fail-under=90

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF
      - name: Run integration tests
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::Integration tests skipped: OPENAI_API_KEY not set"
            exit 0
          fi
          uv run pytest -m integration --no-header -q
