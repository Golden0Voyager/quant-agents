# Pricing configuration — USD per million tokens (input, output).
#
# Edit this file to add or override model prices without touching
# Python source. This file is the primary local pricing source
# (the LiteLLM community catalog is checked first, then this file).
#
# Format: `model_name: [input_price_per_1M, output_price_per_1M]`
# All prices in USD. CNY equivalents are shown in trailing comments.

agnes:
  agnes-2.0-flash: [0.0, 0.0]
  # agnes-3.0-flash: newest free-tier flash; official rate card not published
  # yet — kept at 0.0 like agnes-2.0-flash, revisit when billed
  agnes-3.0-flash: [0.0, 0.0]

deepseek:
  # Official rates verified 2026-09 (api.deepseek.com): deepseek-flash
  # (DeepSeek-V4.1-Flash) cache-miss input $0.30 / output $1.20 per 1M,
  # PEAK window. Off-peak is 50% off and is applied automatically at
  # lookup time when callers pass a timestamp (peak: 01:00-04:00 &
  # 06:00-10:00 UTC Mon-Fri; all other hours + weekends are off-peak).
  # Cache-hit input is $0.006 peak. 1M context, 384K max output.
  deepseek-flash: [0.30, 1.20]
  deepseek-v4-flash: [0.30, 1.20]
  deepseek-v4-pro: [1.32, 3.96]

kimi:
  kimi-k2.6: [0.95, 4.0]              # input(cache hit ¥1.1, miss ¥6.5) / output ¥27
  kimi-k2.7-code: [0.95, 4.0]         # input(cache hit ¥1.3, miss ¥6.5) / output ¥27
  kimi-k3: [3.0, 15.0]                # input(cache hit ¥2, miss ¥20) / output ¥100

modelscope:
  deepseek-ai/DeepSeek-V4-Flash-0731: [0.44, 1.32]
  deepseek-ai/DeepSeek-V4-Pro-0813: [1.32, 3.96]
  stepfun-ai/Step-3.7-Flash: [0.20, 1.15]
  MiniMax/MiniMax-M3: [0.30, 1.20]
  Qwen/Qwen3.5-397B-A17B: [0.60, 3.60]
  Qwen/Qwen3.8-27B: [0.20, 0.80]        # estimated from Qwen ~27B tier rates; verify official price
  ZhipuAI/GLM-5.2: [1.40, 4.40]         # GLM-5.2 official rate $1.4/$4.4 (cached input $0.26)

openrouter:
  nvidia/nemotron-3-ultra-550b-a55b:free: [0.0, 0.0]
  nvidia/nemotron-3-super-120b-a12b:free: [0.0, 0.0]

sensenova:
  # SenseNova also routes DeepSeek V4-Flash at the same USD rate as the
  # deepseek: section above (deepseek-flash $0.30 / $1.20 cache-miss peak).
  deepseek-flash: [0.30, 1.20]
  deepseek-v4-flash: [0.30, 1.20]
  # TokenPlan 2026-08-28 起统一通用积分池（Flash-Lite 另有专属池，消耗 1:1 返赠
  # 通用积分）；Kimi K3 与 DeepSeek-V4 Pro 同日上线 TokenPlan。以下两条按各自
  # 官方费率登记，仅供成本参考（TokenPlan 订阅内实际按积分计）。
  deepseek-v4-pro: [1.32, 3.96]
  kimi-k3: [3.0, 15.0]
  # GLM-5.2 official rate $1.4/$4.4 (cached input $0.26). On the SenseNova
  # Token Plan it is effectively free (500 calls / 5h per model) — this entry
  # is kept at the official rate for cost-reference only.
  glm-5.2: [1.40, 4.40]
  sensenova-6.8-flash-lite: [0.22, 0.66]  # matches builtin catalog rate (¥1.5 / ¥4.5 per 1M)
