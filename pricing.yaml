# Pricing configuration — USD per million tokens (input, output).
#
# Edit this file to add or override model prices without touching
# Python source. This file is the primary local pricing source
# (the LiteLLM community catalog is checked first, then this file).
#
# Format: `model_name: [input_price_per_1M, output_price_per_1M]`
# All prices in USD. CNY equivalents are shown in trailing comments.

agnes:
  agnes-2.0-flash: [0.0, 0.0]

deepseek:
  # Official rates verified 2026-08 (api-docs.deepseek.com): cache-miss input /
  # output, PEAK window. Off-peak is 50% off and is applied automatically at
  # lookup time when callers pass a timestamp (peak: 01:00-04:00 & 06:00-10:00
  # UTC Mon-Fri; all other hours + weekends are off-peak). Cache-hit input is
  # much cheaper (flash $0.014 / pro $0.044 peak). 1M context, 384K max output.
  deepseek-v4-flash: [0.44, 1.32]
  deepseek-v4-pro: [1.32, 3.96]

kimi:
  kimi-k2.6: [0.95, 4.0]              # input(cache hit ¥1.1, miss ¥6.5) / output ¥27
  kimi-k2.7-code: [0.95, 4.0]         # input(cache hit ¥1.3, miss ¥6.5) / output ¥27
  kimi-k3: [3.0, 15.0]                # input(cache hit ¥2, miss ¥20) / output ¥100

modelscope:
  deepseek-ai/DeepSeek-V4-Flash: [0.44, 1.32]
  deepseek-ai/DeepSeek-V4-Pro: [1.32, 3.96]
  stepfun-ai/Step-3.7-Flash: [0.20, 1.15]
  MiniMax/MiniMax-M3: [0.30, 1.20]
  Qwen/Qwen3.5-397B-A17B: [0.60, 3.60]
  ZhipuAI/GLM-5.2: [1.40, 4.40]         # GLM-5.2 official rate $1.4/$4.4 (cached input $0.26)

openrouter:
  nvidia/nemotron-3-ultra-550b-a55b:free: [0.0, 0.0]
  nvidia/nemotron-3-super-120b-a12b:free: [0.0, 0.0]

sensenova:
  # SenseNova also routes DeepSeek V4-Flash (same USD rate as deepseek: section above).
  deepseek-v4-flash: [0.44, 1.32]
  # GLM-5.2 official rate $1.4/$4.4 (cached input $0.26). On the SenseNova
  # Token Plan it is effectively free (500 calls / 5h per model) — this entry
  # is kept at the official rate for cost-reference only.
  glm-5.2: [1.40, 4.40]
  sensenova-6.7-flash-lite: [0.22, 0.66]  # legacy compatibility until 2026-08-31
  sensenova-6.8-flash-lite: [0.22, 0.66]  # temporary carry-over; verify new official rate
